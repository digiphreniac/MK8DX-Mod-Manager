name: Tests

# Runs the unit tests on every pull request and every push to master/main, on Windows, Linux and macOS, so a change that breaks them is visible
# before it is released. (The release workflow builds the packages; this one only checks the code.)

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false          # (a failure on one system must not hide the result on the others)
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the app's requirements
        run: pip install -r requirements.txt

      - name: Install what the workflow checks in the tests read files with
        run: pip install pyyaml

      - name: Run the tests
        run: python -m unittest discover -s tests
