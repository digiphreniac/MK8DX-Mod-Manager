<div id="gb-browse-modal-backdrop" hidden>
  <div id="gb-browse-modal">
    <div id="gb-browse-modal-header">
      <h2 id="gb-browse-modal-title">Browse GameBanana</h2>
      <div id="gb-browse-modal-searchbox" class="gb-searchbox">
        <span data-icon="search" data-size="14" data-stroke="1.8"></span>
        <input id="gb-browse-modal-search" type="text" placeholder="Search GameBanana..." aria-label="Search GameBanana" autocomplete="off" spellcheck="false">
        <button type="button" id="gb-browse-modal-search-clear" class="gb-search-clear" title="Clear the search" aria-label="Clear the search" hidden>✕</button>
      </div>
      <select id="gb-browse-modal-sort" class="gb-sort-select" aria-label="Sort"></select>
      <div id="gb-browse-modal-view" class="gb-view-toggle"></div>
      <button class="ghost" id="btn-gb-browse-modal-close">Close</button>
    </div>
    <div id="gb-browse-modal-body">
      <div id="gb-browse-modal-results"></div>
    </div>
  </div>
</div>
