<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Mario Kart 8 Mod Manager</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/course-select.css">
<link rel="stylesheet" href="css/character-select-layout.css">
<link rel="stylesheet" href="css/character-card.css">
<link rel="stylesheet" href="css/tiles-and-grids.css">
<link rel="stylesheet" href="css/full-list.css">
<link rel="stylesheet" href="css/modal-help.css">
<link rel="stylesheet" href="css/flow.css">
<link rel="stylesheet" href="css/icon-generator.css">
<link rel="stylesheet" href="css/gamebanana-modals.css">
<link rel="stylesheet" href="css/setup-overlay.css">
<link rel="stylesheet" href="css/gamebanana-card.css">
<link rel="stylesheet" href="css/gb-browse.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/add-mod.css">
<link rel="stylesheet" href="css/setting-controls.css">
<link rel="stylesheet" href="css/conflicts.css">
<link rel="stylesheet" href="css/tooltip.css">
<link rel="stylesheet" href="css/app-width.css">
<link rel="stylesheet" href="css/course-screen.css">
<link rel="stylesheet" href="css/course-card.css">
<link rel="stylesheet" href="css/vehicle-screen.css">
<link rel="stylesheet" href="css/item-screen.css">
<link rel="stylesheet" href="css/mod-notes.css">
</head>
<body>

<header>
  <h1>Mario Kart 8 Mod Manager</h1>
  <nav id="stepbar" aria-label="Steps"></nav>
  <div class="header-actions">
    <button id="btn-refresh" class="icon-btn" title="Refresh" aria-label="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    </button>
    <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</header>
<div id="step-hint" hidden></div>
<div id="tabs">
  <button id="tab-characters" class="active">Characters</button>
  <button id="tab-courses">Courses</button>
  <button id="tab-vehicles">Vehicles</button>
  <button id="tab-items">Items</button>
  <button id="tab-more">More</button>
  <button id="tab-list">Full List</button>
</div>

<div id="main">
  <div id="view-characters">
    <div id="char-layout">
      <div id="char-grid-col"><div id="char-grid"></div></div>
      <!-- The character's mods / menu look / GameBanana card, docked beside the grid on a wide
           window (on a small one it opens as the pop-up instead - see wantsDock()). -->
      <aside id="char-detail" aria-label="Character details">
        <div id="char-detail-header">
          <h2 id="char-detail-title"></h2>
        </div>
        <div id="char-detail-body"></div>
      </aside>
    </div>
    <!-- Wide window only: the viewed character's name as the menus will show it (Menu look), centred
         under the grid and card, on a black plate that fades out at both ends. The Next button sits
         at the right end of this same row. -->
    <div id="char-namebar"><div id="char-name-plate"></div></div>
  </div>
  <div id="view-courses" hidden>
    <!-- The Prix medallions on a board, the selected Prix' four courses under it; sized to fit the window
         (fitCourseScreen), so nothing scrolls. When all 24 cups don't fit at a good size they are on two pages
         (the game's, the Booster Course Pass's) and the arrows beside the board turn between them. -->
    <div id="course-layout">
      <div id="cup-stage">
        <button id="cup-prev" class="cup-page-btn" type="button" aria-label="Show the Mario Kart 8 Deluxe cups" title="Mario Kart 8 Deluxe cups">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 5 8 12 15 19"/></svg>
        </button>
        <div id="cup-board"><div id="cup-grid"></div></div>
        <button id="cup-next" class="cup-page-btn" type="button" aria-label="Show the Booster Course Pass cups" title="Booster Course Pass cups">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 5 16 12 9 19"/></svg>
        </button>
      </div>
      <div id="cup-page-label"></div>
      <div id="course-strip"></div>
    </div>
    <!-- The selected Prix (or course), or the one under the mouse: same plate as Character Select. -->
    <div id="course-namebar"><div id="course-name-plate"></div></div>
  </div>
  <div id="view-vehicles" hidden>
    <!-- The three kinds of part (bodies, wheels, gliders) on boards, each part as the game's own picture of it; sized
         to fit the window (fitVehicleScreen), so nothing scrolls. -->
    <div id="vehicle-layout">
      <div id="vehicle-sections"></div>
    </div>
    <!-- The part being viewed, or the one under the mouse: same plate as Character Select. -->
    <div id="vehicle-namebar"><div id="vehicle-name-plate"></div></div>
  </div>
  <div id="view-items" hidden>
    <!-- Every item as the game's own picture of it, on a board; on a wide window the picked item's card is docked beside it
         (like Character Select - on a small one it opens as a pop-up). Sized to fit the window (fitItemGrid), so nothing
         scrolls. -->
    <div id="item-layout">
      <div id="item-grid-col"><div id="item-grid"></div></div>
      <aside id="item-detail" aria-label="Item details">
        <div id="item-detail-header">
          <h2 id="item-detail-title"></h2>
        </div>
        <div id="item-detail-body"></div>
      </aside>
    </div>
    <!-- The item being viewed, or the one under the mouse: same plate as Character Select. -->
    <div id="item-namebar"><div id="item-name-plate"></div></div>
  </div>
  <div id="view-more" hidden>
    <div id="more-intro">
      <div id="more-intro-title">Everything that isn't for one character, course, vehicle part or item</div>
      <div id="more-intro-text">Each category works like a card: browse or search GameBanana, or paste a link.</div>
    </div>
    <div id="more-list"></div>
  </div>
  <div id="view-list" hidden>
    <div id="checklist"><div id="empty-msg">Loading mods...</div></div>
    <button id="btn-add-mod-fab" title="Add a mod">+</button>
  </div>
  <div id="view-commit" class="page" hidden><div class="page-inner flow-body" id="commit-body"></div></div>
  <div id="view-switch" class="page" hidden><div class="page-inner flow-body" id="switch-body"></div></div>
</div>

<footer id="stats-footer">
  <span id="stat-courses" class="stat-item">Courses modded: &mdash;</span>
  <span id="stat-characters" class="stat-item">Characters modded: &mdash;</span>
  <span id="stat-size" class="stat-item">Downloaded: &mdash;</span>
  <span id="footer-right">
    <span id="app-version" title="App version"></span>
    <a id="support-link" href="javascript:void(0)" title="Buy Me a Coffee">Donate</a>
    <a id="help-link" href="javascript:void(0)">Help</a>
  </span>
</footer>

<div id="next-dock"><button id="btn-next" class="primary" hidden></button></div>

<script src="js/diagnostics.js"></script>
<script src="js/bootstrap.js"></script>
</body>
</html>
